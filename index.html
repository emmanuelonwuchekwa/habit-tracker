<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Components — IT Fundamentals</title>
<style>
  :root, html[data-theme="dark"]{
    --bg: #0a0d13;
    --bg-soft: radial-gradient(1200px 600px at 15% -10%, #10231a 0%, rgba(16,35,26,0) 55%),
               radial-gradient(900px 500px at 100% 0%, #131a2c 0%, rgba(19,26,44,0) 50%);
    --panel: #10141c;
    --panel-2: #0d1119;
    --card: #131826;
    --card-border: #232a3b;
    --line: #1c2130;
    --text: #e9ecf1;
    --text-dim: #8992a6;
    --text-faint: #5a6478;
    --accent: #9be13d;
    --accent-dim: #6f9c2e;
    --accent-rgb: 155,225,61;
    --accent-bg: rgba(var(--accent-rgb),0.10);
    --accent-bg-strong: rgba(var(--accent-rgb),0.16);
    --on-accent: #0a0d13;
    --success: #9be13d;
    --success-dim: #6f9c2e;
    --success-rgb: 155,225,61;
    --success-bg: rgba(var(--success-rgb),0.10);
    --on-success: #0a0d13;
    --red: #ef5a5a;
    --red-rgb: 239,90,90;
    --red-bg: rgba(var(--red-rgb),0.08);
    --red-border: rgba(var(--red-rgb),0.35);
    --focus-glow: 0 0 0 1px rgba(var(--accent-rgb),0.4), 0 0 24px rgba(var(--accent-rgb),0.12);
    --btn-shadow: 0 4px 0 var(--accent-dim);
    --card-shadow: 0 10px 26px -14px rgba(0,0,0,0.5);
    --app-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
    --radius: 14px;
    --radius-sm: 10px;
    --tag-explain-bg: rgba(120,150,255,0.12);
    --tag-explain-color: #9db4ff;
    --explain-img-bg: linear-gradient(160deg, #1e232c, #14181f);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- Gamified light theme ---------- */
  html[data-theme="light"]{
    --bg: #eef0ff;
    --bg-soft: radial-gradient(1100px 560px at 12% -10%, rgba(124,77,255,0.16) 0%, rgba(124,77,255,0) 55%),
               radial-gradient(900px 520px at 100% 0%, rgba(255,196,60,0.20) 0%, rgba(255,196,60,0) 50%),
               radial-gradient(700px 500px at 90% 90%, rgba(16,193,255,0.14) 0%, rgba(16,193,255,0) 55%);
    --panel: #ffffff;
    --panel-2: #f7f7ff;
    --card: #ffffff;
    --card-border: #e4e1f7;
    --line: #ece9fb;
    --text: #241f3d;
    --text-dim: #6b6790;
    --text-faint: #a19dc7;
    --accent: #7c4dff;
    --accent-dim: #5d33e0;
    --accent-rgb: 124,77,255;
    --on-accent: #ffffff;
    --success: #16c172;
    --success-dim: #0f9c5c;
    --success-rgb: 22,193,114;
    --on-success: #ffffff;
    --red: #ff4d6d;
    --red-rgb: 255,77,109;
    --focus-glow: 0 0 0 1px rgba(var(--accent-rgb),0.45), 0 0 24px rgba(var(--accent-rgb),0.22);
    --btn-shadow: 0 4px 0 var(--accent-dim);
    --card-shadow: 0 10px 24px -12px rgba(76,60,150,0.22);
    --app-shadow: 0 30px 70px -30px rgba(76,60,150,0.35);
    --tag-explain-bg: rgba(14,150,233,0.12);
    --tag-explain-color: #0e73c7;
    --explain-img-bg: linear-gradient(160deg, #f3f1ff, #eef0ff);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg-soft), var(--bg);
    color: var(--text);
    min-height:100vh;
    padding: 28px 16px 60px;
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width: 860px;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow:hidden;
    box-shadow: var(--app-shadow);
  }

  /* ---------- Header ---------- */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 20px 26px;
    border-bottom: 1px solid var(--line);
    position:relative;
  }
  .header::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(90deg, rgba(var(--accent-rgb),0.05) 1px, transparent 1px),
      linear-gradient(0deg, rgba(var(--accent-rgb),0.05) 1px, transparent 1px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(90deg, black, transparent 70%);
            mask-image: linear-gradient(90deg, black, transparent 70%);
    pointer-events:none;
    opacity:0.6;
  }
  .header-left{ display:flex; align-items:center; gap:12px; z-index:1; }
  .header-icon{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    border:1.5px solid var(--accent-dim);
    border-radius: 9px;
    background: var(--accent-bg);
  }
  .header-titles{ display:flex; flex-direction:column; gap:3px; }
  .header-title{ font-size:17px; font-weight:700; letter-spacing:0.2px; }
  .instructor-badge{
    display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; color: var(--text-dim);
    letter-spacing:0.2px;
  }
  .instructor-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(var(--success-rgb),0.25);
  }
  .header-right{ display:flex; align-items:center; gap:14px; z-index:1; }
  .header-pct{ font-size:15px; font-weight:700; color: var(--accent); font-variant-numeric: tabular-nums; }

  .theme-toggle{
    position:relative;
    width:52px; height:28px;
    border-radius:99px;
    background: var(--panel-2);
    border: 1px solid var(--card-border);
    cursor:pointer;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 6px;
    transition: background .2s, border-color .2s;
  }
  .theme-toggle svg{ width:13px; height:13px; color: var(--text-faint); position:relative; z-index:1; }
  .theme-toggle-knob{
    position:absolute; top:2.5px; left:2.5px;
    width:21px; height:21px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 2px 6px -1px rgba(var(--accent-rgb),0.6);
    transition: transform .3s cubic-bezier(.4,0,.2,1), background .2s;
  }
  html[data-theme="light"] .theme-toggle-knob{ transform: translateX(24px); }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap: 30px;
    padding: 16px 26px 0;
  }
  .tab{
    display:flex; align-items:center; gap:8px;
    padding-bottom: 12px;
    border-bottom: 2px solid transparent;
    color: var(--text-faint);
    font-size:14px; font-weight:600;
    cursor: default;
    user-select:none;
  }
  .tab .num{
    width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700;
    background: var(--card); color: var(--text-faint);
    border:1px solid var(--card-border);
  }
  .tab.active{ color: var(--accent); border-bottom-color: var(--accent); }
  .tab.active .num{ background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .tab.unlocked{ color: var(--text-dim); cursor:pointer; }
  .tab.unlocked:hover{ color: var(--text); }
  .tab .lock{ opacity:0.55; }

  .divider{ height:1px; background: var(--line); margin: 16px 0 0; }

  /* ---------- Body ---------- */
  .body-pad{ padding: 22px 26px 26px; }
  .intro{ color: var(--text-dim); font-size: 14.5px; line-height:1.5; margin: 0 0 20px; }

  .progress-row{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:8px;
  }
  .progress-label{ font-size:14px; font-weight:700; color: var(--text); }
  .progress-count{ font-size:13.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .progress-track{
    height:7px; border-radius:99px; background: var(--card);
    border:1px solid var(--card-border);
    overflow:hidden; margin-bottom: 26px;
  }
  .progress-fill{
    height:100%; width:0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius:99px;
    transition: width .45s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 620px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  .tile{
    position:relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px 10px 14px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    cursor:pointer;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .tile:hover{
    transform: translateY(-3px);
    border-color: var(--accent-dim);
    box-shadow: 0 10px 26px -14px rgba(var(--accent-rgb),0.35);
  }
  .tile .icon-box{
    width:64px; height:64px;
    border-radius:10px;
    background: linear-gradient(160deg, rgba(var(--t-rgb, var(--accent-rgb)),0.16), rgba(var(--t-rgb, var(--accent-rgb)),0.04));
    border: 1px solid rgba(var(--t-rgb, var(--accent-rgb)),0.22);
    display:flex; align-items:center; justify-content:center;
    color: var(--accent);
    transition: background .2s, border-color .2s;
  }
  .tile .icon-box img{ width:100%; height:100%; object-fit:contain; padding:8px; }

  /* Gamified tile palette — only kicks in for the bright theme */
  html[data-theme="light"] .grid .tile:nth-child(1) .icon-box{ --t-rgb: 124,77,255; }
  html[data-theme="light"] .grid .tile:nth-child(2) .icon-box{ --t-rgb: 236,72,153; }
  html[data-theme="light"] .grid .tile:nth-child(3) .icon-box{ --t-rgb: 249,115,22; }
  html[data-theme="light"] .grid .tile:nth-child(4) .icon-box{ --t-rgb: 217,164,6; }
  html[data-theme="light"] .grid .tile:nth-child(5) .icon-box{ --t-rgb: 20,166,151; }
  html[data-theme="light"] .grid .tile:nth-child(6) .icon-box{ --t-rgb: 14,150,233; }
  html[data-theme="light"] .grid .tile:nth-child(7) .icon-box{ --t-rgb: 236,60,90; }
  html[data-theme="light"] .grid .tile:nth-child(8) .icon-box{ --t-rgb: 16,169,119; }
  .tile .label{ font-size:13px; font-weight:600; text-align:center; color: var(--text); line-height:1.3; }

  .tile.selected{
    border-color: var(--accent);
    box-shadow: var(--focus-glow);
    cursor:default;
  }
  .tile.selected:hover{ transform:none; }

  .tile.disabled{
    opacity: 0.38;
    cursor:not-allowed;
    pointer-events:none;
  }
  .tile.disabled:hover{ transform:none; box-shadow:none; border-color: var(--card-border); }

  .tile .lock-overlay{
    position:absolute; top:8px; right:8px;
    width:20px; height:20px; border-radius:50%;
    background: rgba(10,13,19,0.7);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
  }
  .tile .lock-overlay svg{ width:11px; height:11px; }

  .tile .check-badge{
    position:absolute; top:-8px; right:-8px;
    width:24px; height:24px; border-radius:50%;
    background: var(--success);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 4px var(--panel), 0 3px 8px -2px rgba(var(--success-rgb),0.6);
    animation: badgePop .4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes badgePop{
    0%{ transform: scale(0); }
    60%{ transform: scale(1.2); }
    100%{ transform: scale(1); }
  }
  .tile .check-badge svg{ width:13px; height:13px; color: var(--on-success); }

  /* ---------- Panel ---------- */
  .panel-wrap{
    margin-top: 22px;
    display:none;
  }
  .panel-wrap.show{ display:block; animation: rise .28s ease; }
  @keyframes rise{ from{ opacity:0; transform: translateY(10px);} to{ opacity:1; transform:none; } }

  .panel{
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius: var(--radius);
    overflow:hidden;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 22px;
    border-bottom:1px solid var(--line);
  }
  .panel-head h2{ margin:0; font-size:17px; font-weight:700; }
  .panel-close{
    width:28px; height:28px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); background:transparent; border:none;
    cursor:pointer; transition: background .15s, color .15s;
  }
  .panel-close:hover{ background: var(--card-border); color: var(--text); }

  .panel-body{ padding: 20px 22px 22px; }

  .tag-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .tag{
    font-size:11px; font-weight:800; letter-spacing:0.6px;
    padding: 4px 9px; border-radius:99px;
    background: var(--accent-bg); color: var(--accent);
    text-transform:uppercase;
  }
  .tag.tag-explain{ background: var(--tag-explain-bg); color: var(--tag-explain-color); }
  .tag-sub{ font-size:13px; color: var(--text-dim); }

  .question-text{ font-size:16px; font-weight:700; line-height:1.45; margin: 4px 0 18px; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .option{
    display:flex; align-items:center; gap:12px;
    padding: 13px 16px;
    border:1px solid var(--card-border);
    border-radius: var(--radius-sm);
    background: var(--panel-2);
    cursor:pointer;
    font-size:14px; line-height:1.4;
    transition: border-color .15s, background .15s;
  }
  .option:hover{ border-color: var(--accent-dim); }
  .option.picked{ border-color: var(--accent); background: var(--accent-bg); }
  .option .letter{
    flex:0 0 auto;
    width:26px; height:26px; border-radius:7px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
    background: var(--card); border:1px solid var(--card-border);
    color: var(--text-dim);
  }
  .option.picked .letter{ background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .btn{
    appearance:none; border:none; cursor:pointer;
    font-size:14px; font-weight:700;
    padding: 12px 22px; border-radius: 10px;
    transition: filter .15s, opacity .15s, transform .08s, box-shadow .08s;
    font-family: inherit;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--accent); color: var(--on-accent); box-shadow: var(--btn-shadow); }
  .btn-primary:hover:not(:disabled){ filter: brightness(1.08); }
  .btn-primary:active:not(:disabled){ transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dim); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background: var(--card); color: var(--text); border:1px solid var(--card-border); }
  .btn-ghost:hover{ border-color: var(--accent-dim); }
  .btn-outline-red{ background: transparent; color: var(--red); border:1px solid var(--red-border); }
  .btn-outline-red:hover{ background: var(--red-bg); }

  .feedback{
    border-radius: var(--radius-sm);
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .feedback.wrong{ background: var(--red-bg); border:1px solid var(--red-border); }
  .feedback.correct{ background: var(--success-bg); border:1px solid rgba(var(--success-rgb),0.4); }
  .feedback-title{
    display:flex; align-items:center; gap:8px;
    font-size:14.5px; font-weight:800; margin-bottom:8px;
  }
  .feedback.wrong .feedback-title{ color: var(--red); }
  .feedback.correct .feedback-title{ color: var(--success); }
  .feedback-title svg{ width:18px; height:18px; flex:0 0 auto; }
  .feedback-text{ font-size:13.5px; color: var(--text); line-height:1.55; }

  .explain-text{ font-size:14px; line-height:1.7; color: var(--text); margin: 2px 0 20px; }
  .explain-link{ font-size:13px; color: var(--text-dim); text-decoration:none; border-bottom:1px dashed var(--text-faint); }

  .explain-img{
    width:100%;
    aspect-ratio: 16/9;
    border-radius: var(--radius-sm);
    background: var(--explain-img-bg);
    border: 1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 22px;
    overflow:hidden;
  }
  .explain-img img{ width:100%; height:100%; object-fit:cover; }

  .panel-actions{ display:flex; justify-content:flex-end; gap:10px; }

  /* ---------- Placeholder (locked tab preview) ---------- */
  .locked-preview{
    text-align:center; padding: 50px 20px;
    color: var(--text-dim); font-size:14px;
  }
  .locked-preview svg{ width:34px; height:34px; color: var(--text-faint); margin-bottom:14px; }

  /* ---------- Footer ---------- */
  .footer{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 26px;
    border-top: 1px solid var(--line);
  }
  .footer-label{ font-size:12px; color: var(--text-faint); letter-spacing:0.2px; }
  .reset-btn{
    background:none; border:none; cursor:pointer;
    font-size:11.5px; color: var(--text-faint);
    padding: 4px 2px;
    font-family: inherit;
    border-bottom: 1px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .reset-btn:hover{ color: var(--text-dim); border-color: var(--text-faint); }

  /* ---------- Tab check state ---------- */
  .tab .num.num-done{ background: var(--success); border-color: var(--success); color: var(--on-success); }

  /* ---------- Inspection (tab 2) ---------- */
  .section-title{ text-align:center; margin: 4px 0 10px; font-size:22px; font-weight:800; }
  .inspect-actions{ display:flex; justify-content:space-between; gap:12px; margin: 18px 0 18px; }
  .hint-box{
    background: var(--card); border:1px solid var(--card-border); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 18px;
  }
  .hint-title{ color: var(--accent); font-weight:800; font-size:13.5px; margin-bottom:4px; }
  .hint-text{ color: var(--text-dim); font-size:13px; line-height:1.5; }

  .board-wrap{
    position:relative;
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    overflow:hidden;
    box-shadow: var(--focus-glow);
    background: var(--card);
    line-height: 0;
  }
  .board-img{ width:100%; height:auto; display:block; user-select:none; -webkit-user-drag:none; }

  .hotspot{
    position:absolute;
    width: 26px; height:26px;
    border-radius:50%;
    transform: translate(-50%,-50%);
    background: rgba(var(--accent-rgb),0.28);
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.55);
    cursor:pointer;
    padding:0; appearance:none;
    animation: hotspotPulse 2.2s ease-in-out infinite;
  }
  .hotspot:focus{ outline: none; }
  .hotspot:focus-visible{ box-shadow: 0 0 0 4px rgba(var(--accent-rgb),0.35); }
  .hotspot.explored{
    background: rgba(var(--success-rgb),0.28);
    border-color: var(--success);
    animation: none;
  }
  .hotspot.rumble{ animation: hotspotRumble .32s ease; }

  @keyframes hotspotPulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.45); }
    50%{ box-shadow: 0 0 0 8px rgba(var(--accent-rgb),0); }
  }
  @keyframes hotspotRumble{
    0%{ transform: translate(-50%,-50%) scale(1); }
    20%{ transform: translate(calc(-50% - 2px), calc(-50% + 1px)) scale(1.12); }
    40%{ transform: translate(calc(-50% + 2px), calc(-50% - 1px)) scale(1.12); }
    60%{ transform: translate(calc(-50% - 1px), calc(-50% + 2px)) scale(1.12); }
    80%{ transform: translate(calc(-50% + 1px), calc(-50% - 2px)) scale(1.12); }
    100%{ transform: translate(-50%,-50%) scale(1); }
  }

  .board-tooltip{
    position:absolute;
    left:0; top:0;
    transform: translate(-50%, calc(-100% - 16px));
    width: 220px;
    max-width: 60vw;
    background: var(--panel);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    box-shadow: var(--card-shadow);
    opacity:0; pointer-events:none;
    transition: opacity .15s ease, transform .15s ease;
    z-index: 5;
  }
  .board-tooltip.show{ opacity:1; }
  .board-tooltip.flip{ transform: translate(-50%, 16px); }
  .tt-title{ font-size:13px; font-weight:800; color: var(--accent); margin-bottom:5px; }
  .tt-text{ font-size:12.5px; line-height:1.5; color: var(--text); }

  @media (max-width: 560px){
    .inspect-actions{ flex-direction:column-reverse; }
    .board-tooltip{ width: 180px; }
  }

  /* ---------- Section-complete modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(5,6,10,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    z-index: 999;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-card{
    width:100%; max-width: 380px;
    background: var(--card);

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
let completed = {};          // id -> true
let activeId = null;         // currently open component id
let selectedOption = null;   // index chosen in current question
let stage = null;            // 'question' | 'wrong' | 'explainFromWrong' | 'correct' | 'explainFull' | 'review'
let sawExplanation = false;  // seen explanation already this attempt?
let activeMainTab = 1;       // 1,2,3
let exploredHotspots = new Set(); // inspection hotspot ids seen

const TABS = [
  { n: 1, label: "Components" },
  { n: 2, label: "Inspection" },
  { n: 3, label: "Exercise" },
];

const HOTSPOTS = [
  { id: "io", x: 29, y: 29, name: "Rear I/O Panel",
    desc: "External USB, Ethernet, audio, and display ports live here — everything you plug in from behind the case." },
  { id: "cpu-socket", x: 59, y: 45, name: "CPU Socket",
    desc: "The processor seats here and locks in with a retention arm, making contact with hundreds of tiny pins or pads." },
  { id: "ram-slots", x: 77, y: 50, name: "RAM Slots",
    desc: "Memory sticks click in here. Running two matched sticks together (dual-channel) gives a noticeable speed boost." },
  { id: "pcie-slot", x: 42, y: 47, name: "PCIe Slot",
    desc: "The long slot expansion cards like a graphics card plug into, supplying both power and a high-speed data path." },
  { id: "chipset", x: 47, y: 68, name: "Chipset Heatsink",
    desc: "Cools the chipset underneath — the traffic controller that routes communication between the CPU and everything else on the board." },
  { id: "power-24pin", x: 85, y: 58, name: "24-Pin Power Connector",
    desc: "The PSU's main cable clips in here, feeding power to the whole motherboard." },
  { id: "battery", x: 39, y: 55, name: "CMOS Battery",
    desc: "A small coin-cell battery that keeps the clock and BIOS settings alive even when the PC is unplugged." },
  { id: "sata", x: 53, y: 80, name: "SATA Ports",
    desc: "These connectors link storage drives — HDDs and older SSDs — to the motherboard using SATA data cables." },
];

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function getComp(id){ return COMPONENTS.find(c => c.id === id); }
function progressCount(){ return Object.keys(completed).filter(k => completed[k]).length; }
function allDone(){ return progressCount() === COMPONENTS.length; }
function tab2Unlocked(){ return allDone(); }
function tab3Unlocked(){ return exploredHotspots.size === HOTSPOTS.length; }
function iconSized(svg, px){ return svg.replace('<svg ', `<svg width="${px}" height="${px}" `); }

function overallPercent(){
  const compPct = (progressCount() / COMPONENTS.length) * 70;
  const inspPct = (exploredHotspots.size / HOTSPOTS.length) * 30;
  return Math.round(compPct + inspPct);
}

function updateHeaderPct(){
  document.getElementById('headerPct').textContent = overallPercent() + '%';
}

/* ---------------------------------------------------------
   RENDER: TABS
--------------------------------------------------------- */
function renderTabs(){
  const row = document.getElementById('tabsRow');
  row.innerHTML = TABS.map(t => {
    const isActive = t.n === activeMainTab;
    const unlocked = t.n === 1 ? true : (t.n === 2 ? tab2Unlocked() : tab3Unlocked());
    const isLocked = !unlocked;
    const isCompleted = t.n === 1 && allDone();
    let cls = 'tab';
    if (isActive) cls += ' active';
    if (unlocked && !isActive) cls += ' unlocked';
    const numInner = isCompleted ? iconSized(ICON_CHECK, 11) : t.n;
    return `<div class="${cls}" data-tab="${t.n}" style="${isLocked ? 'cursor:default;' : ''}">
      <span class="num ${isCompleted ? 'num-done' : ''}">${numInner}</span>
      <span>${t.label}</span>
      ${isLocked ? `<span class="lock" style="width:12px;height:12px;display:inline-flex;">${iconSized(ICON_LOCK, 12)}</span>` : ''}
    </div>`;
  }).join('');

  row.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => {
      const n = parseInt(el.dataset.tab, 10);
      const unlocked = n === 1 ? true : (n === 2 ? tab2Unlocked() : tab3Unlocked());
      if (!unlocked) return;
      activeMainTab = n;
      activeId = null;
      renderTabs();
      renderBody();
    });
  });
}

/* ---------------------------------------------------------
   RENDER: BODY (switches on active tab)
--------------------------------------------------------- */
function renderBody(){
  const pad = document.getElementById('bodyPad');
  if (activeMainTab === 1){
    pad.innerHTML = `
      <p class="intro">Click a component to discover what it does. Complete all ${COMPONENTS.length} to unlock the next section.</p>
      <div class="progress-row">
        <span class="progress-label">Progress</span>
        <span class="progress-count" id="progressCount">${progressCount()} / ${COMPONENTS.length}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="grid" id="grid"></div>
      <div class="panel-wrap" id="panelWrap"><div class="panel" id="panel"></div></div>
    `;
    renderGrid();
    renderPanel();
    updateProgressBar();
  } else if (activeMainTab === 2){
    pad.innerHTML = `
      <h2 class="section-title">Motherboard Inspection</h2>
      <p class="intro" style="text-align:center;">Explore the motherboard to learn where each component connects. Hover over the highlighted areas to see details.</p>
      <div class="inspect-actions">
        <button class="btn btn-ghost" id="backToComponentsBtn">Back to Components</button>
        <button class="btn btn-primary" id="startExerciseBtn" ${tab3Unlocked() ? '' : 'disabled'}>Start Exercise</button>
      </div>
      <div class="hint-box">
        <div class="hint-title">Hover a highlighted area on the motherboard</div>
        <div class="hint-text">Move your mouse over a highlight (or use Tab) to see which connector it is and which component plugs into it.</div>
      </div>
      <div class="board-wrap" id="boardWrap">
        <img src="${PHOTOS.motherboard.explain}" class="board-img" alt="Motherboard" draggable="false">
        ${HOTSPOTS.map(h => `
          <button type="button" class="hotspot ${exploredHotspots.has(h.id) ? 'explored' : ''}" data-id="${h.id}" style="left:${h.x}%; top:${h.y}%;" aria-label="${h.name}"></button>
        `).join('')}
        <div class="board-tooltip" id="boardTooltip"></div>
      </div>
    `;
    initInspection();
  } else {
    pad.innerHTML = `
      <div class="locked-preview">
        ${iconSized(ICON_CHECKCIRCLE, 34)}
        <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;">Exercise</div>
        <div>Nice work exploring the motherboard. This part of the module is coming soon.</div>
      </div>
    `;
  }
  updateHeaderPct();
}

function updateProgressBar(){
  const fill = document.getElementById('progressFill');
  const count = document.getElementById('progressCount');
  if (!fill) return;
  const pct = (progressCount() / COMPONENTS.length) * 100;
  fill.style.width = pct + '%';
  count.textContent = `${progressCount()} / ${COMPONENTS.length}`;
}

/* ---------------------------------------------------------
   RENDER / WIRE: INSPECTION (tab 2)
--------------------------------------------------------- */
function initInspection(){
  const tooltip = document.getElementById('boardTooltip');
  const markers = document.querySelectorAll('.hotspot');

  function activate(marker){
    const data = HOTSPOTS.find(h => h.id === marker.dataset.id);
    if (!data) return;
    tooltip.innerHTML = `<div class="tt-title">${data.name}</div><div class="tt-text">${data.desc}</div>`;
    tooltip.style.left = data.x + '%';
    tooltip.style.top = data.y + '%';
    tooltip.classList.toggle('flip', data.y > 55);
    tooltip.classList.add('show');
    marker.classList.add('rumble');
    if (navigator.vibrate) { try { navigator.vibrate(16); } catch (e) {} }

    if (!exploredHotspots.has(data.id)){
      exploredHotspots.add(data.id);
      marker.classList.add('explored');
      updateHeaderPct();
      renderTabs();
      const startBtn = document.getElementById('startExerciseBtn');
      if (startBtn) startBtn.disabled = !tab3Unlocked();
    }
  }
  function deactivate(marker){
    tooltip.classList.remove('show');
    marker.classList.remove('rumble');
  }

  markers.forEach(m => {
    m.addEventListener('mouseenter', () => activate(m));
    m.addEventListener('mouseleave', () => deactivate(m));
    m.addEventListener('focus', () => activate(m));
    m.addEventListener('blur', () => deactivate(m));
    m.addEventListener('click', (e) => { e.stopPropagation(); activate(m); });
  });

  const backBtn = document.getElementById('backToComponentsBtn');
  if (backBtn) backBtn.addEventListener('click', () => {
    activeMainTab = 1;
    renderTabs();
    renderBody();
  });

  const startBtn = document.getElementById('startExerciseBtn');
  if (startBtn) startBtn.addEventListener('click', () => {
    if (!tab3Unlocked()) return;
    activeMainTab = 3;
    renderTabs();
    renderBody();
  });
}

/* ---------------------------------------------------------
   SECTION COMPLETE MODAL
--------------------------------------------------------- */
function showSectionCompleteModal(){
  document.getElementById('sectionCompleteOverlay').classList.add('show');
}
function hideSectionCompleteModal(){
  document.getElementById('sectionCompleteOverlay').classList.remove('show');
}

/* ---------------------------------------------------------
   RENDER: GRID
--------------------------------------------------------- */
function renderGrid(){
  const grid = document.getElementById('grid');
  if (!grid) return;
  const panelOpen = !!activeId;

  grid.innerHTML = COMPONENTS.map(c => {
    const isSelected = c.id === activeId;
    const isDone = !!completed[c.id];
    let cls = 'tile';
    if (isSelected) cls += ' selected';
    if (panelOpen && !isSelected) cls += ' disabled';

    return `<div class="${cls}" data-id="${c.id}">
      ${isDone ? `<div class="check-badge">${ICON_CHECK}</div>` : ''}
      ${panelOpen && !isSelected ? `<div class="lock-overlay">${ICON_LOCK}</div>` : ''}
      <div class="icon-box"><img src="${PHOTOS[c.id].icon}" alt="${c.name}"></div>
      <div class="label">${c.name}</div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.tile').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('disabled')) return;
      if (el.classList.contains('selected')) return;
      openComponent(el.dataset.id);
    });
  });
}

/* ---------------------------------------------------------
   PANEL FLOW
--------------------------------------------------------- */
function openComponent(id){
  activeId = id;
  selectedOption = null;
  sawExplanation = false;
  stage = completed[id] ? 'review' : 'question';
  renderGrid();
  renderPanel();
  const wrap = document.getElementById('panelWrap');
  wrap.classList.add('show');
  setTimeout(() => wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function closePanel(){
  activeId = null;
  stage = null;
  document.getElementById('panelWrap').classList.remove('show');
  renderGrid();
}

function selectOption(idx){
  selectedOption = idx;
  renderPanel();
}

function checkAnswer(){
  if (selectedOption === null) return;
  const comp = getComp(activeId);
  stage = (selectedOption === comp.correct) ? 'correct' : 'wrong';
  renderPanel();
}

function learnMoreFromWrong(){
  sawExplanation = true;
  stage = 'explainFromWrong';
  renderPanel();
}

function backToQuestion(){
  stage = 'question';
  selectedOption = null;
  renderPanel();
}

function continueFromCorrect(){
  if (sawExplanation){
    completeComponent();
  } else {
    stage = 'explainFull';
    renderPanel();
  }
}

function completeComponent(){
  const wasAllDone = allDone();
  completed[activeId] = true;
  const isNowAllDone = allDone();
  closePanel();
  renderBody();
  triggerConfetti(isNowAllDone && !wasAllDone ? 46 : 18);
  if (isNowAllDone && !wasAllDone){
    setTimeout(showSectionCompleteModal, 650);
  }
}

/* ---------------------------------------------------------
   RENDER: PANEL (the big card below the grid)
--------------------------------------------------------- */
function renderPanel(){
  const panel = document.getElementById('panel');
  if (!panel || !activeId) return;
  const comp = getComp(activeId);

  const headerHtml = `
    <div class="panel-head">
      <h2>${comp.name}</h2>
      <button class="panel-close" id="panelCloseBtn">${ICON_CLOSE}</button>
    </div>`;

  let bodyHtml = '';

  if (stage === 'review'){
    bodyHtml = `
      <div class="tag-row"><span class="tag tag-explain">Explanation</span><span class="tag-sub">You've completed this one</span></div>
      <div class="explain-img"><img src="${PHOTOS[comp.id].explain}" alt="${comp.name}"></div>
      <p class="explain-text">${comp.explanation}</p>
      <div class="panel-actions"><button class="btn btn-primary" id="reviewCloseBtn">Close</button></div>
    `;
  }

  else if (stage === 'question'){
    bodyHtml = `
      <div class="tag-row"><span class="tag">Question</span><span class="tag-sub">Test your knowledge</span></div>
      <p class="question-text">${comp.question}</p>
      <div class="options">
        ${comp.options.map((opt, i) => `
          <div class="option ${selectedOption === i ? 'picked' : ''}" data-idx="${i}">
            <span class="letter">${String.fromCharCode(65+i)}</span>
            <span>${opt}</span>
          </div>`).join('')}
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="checkBtn" ${selectedOption === null ? 'disabled' : ''}>Check Answer</button>
      </div>
    `;
  }

  else if (stage === 'wrong'){
    bodyHtml = `
      <div class="tag-row"><span class="tag">Question</span><span class="tag-sub">Test your knowledge</span></div>
      <div class="feedback wrong">
        <div class="feedback-title">${ICON_ALERT}Not quite...</div>
        <div class="feedback-text">${comp.wrongMsg}</div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-ghost" id="learnMoreBtn">Learn More ${ICON_CHEVRON}</button>
      </div>
    `;
  }

  else if (stage === 'explainFromWrong'){
    bodyHtml = `
      <div class="tag-row"><span class="tag tag-explain">Explanation</span><span class="tag-sub">Learn more about ${comp.name}</span></div>
      <div class="explain-img"><img src="${PHOTOS[comp.id].explain}" alt="${comp.name}"></div>
      <p class="explain-text">${comp.explanation}</p>
      <div class="panel-actions">
        <button class="btn btn-ghost" id="backToQBtn">Back to Question</button>
      </div>
    `;
  }

  else if (stage === 'correct'){
    bodyHtml = `
      <div class="tag-row"><span class="tag">Question</span><span class="tag-sub">Test your knowledge</span></div>
      <div class="feedback correct">
        <div class="feedback-title">${ICON_CHECKCIRCLE}Correct!</div>
        <div class="feedback-text">${comp.correctMsg}</div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-primary" id="continueBtn">Continue ${ICON_CHEVRON}</button>
      </div>
    `;
  }

  else if (stage === 'explainFull'){
    bodyHtml = `
      <div class="tag-row"><span class="tag tag-explain">Explanation</span><span class="tag-sub">Learn more about ${comp.name}</span></div>
      <div class="explain-img"><img src="${PHOTOS[comp.id].explain}" alt="${comp.name}"></div>
      <p class="explain-text">${comp.explanation}</p>
      <div class="panel-actions">
        <button class="btn btn-primary" id="completeBtn">Complete</button>
      </div>
    `;
  }

  panel.innerHTML = headerHtml + `<div class="panel-body">${bodyHtml}</div>`;

  // wire up events for whatever is present
  const closeBtn = document.getElementById('panelCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', closePanel);

  const reviewClose = document.getElementById('reviewCloseBtn');
  if (reviewClose) reviewClose.addEventListener('click', closePanel);

  panel.querySelectorAll('.option').forEach(el => {
    el.addEventListener('click', () => selectOption(parseInt(el.dataset.idx, 10)));
  });

  const checkBtn = document.getElementById('checkBtn');
  if (checkBtn) checkBtn.addEventListener('click', checkAnswer);

  const learnMoreBtn = document.getElementById('learnMoreBtn');
  if (learnMoreBtn) learnMoreBtn.addEventListener('click', learnMoreFromWrong);

  const backToQBtn = document.getElementById('backToQBtn');
  if (backToQBtn) backToQBtn.addEventListener('click', backToQuestion);

  const continueBtn = document.getElementById('continueBtn');
  if (continueBtn) continueBtn.addEventListener('click', continueFromCorrect);

  const completeBtn = document.getElementById('completeBtn');
  if (completeBtn) completeBtn.addEventListener('click', completeComponent);
}

/* ---------------------------------------------------------
   RESET
--------------------------------------------------------- */
document.getElementById('resetBtn').addEventListener('click', () => {
  completed = {};
  activeId = null;
  stage = null;
  activeMainTab = 1;
  exploredHotspots = new Set();
  hideSectionCompleteModal();
  renderTabs();
  renderBody();
});

document.getElementById('continueSectionBtn').addEventListener('click', () => {
  hideSectionCompleteModal();
  activeMainTab = 2;
  activeId = null;
  renderTabs();
  renderBody();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---------------------------------------------------------
   THEME TOGGLE
--------------------------------------------------------- */
const rootEl = document.documentElement;
let currentTheme = 'dark';

function setTheme(theme){
  currentTheme = theme;
  rootEl.setAttribute('data-theme', theme);
  try { localStorage.setItem('ccTheme', theme); } catch (e) {}
}

(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('ccTheme'); } catch (e) {}
  setTheme(saved === 'light' || saved === 'dark' ? saved : 'dark');
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  setTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

/* ---------------------------------------------------------
   CONFETTI — small celebratory burst on completing a component
--------------------------------------------------------- */
const CONFETTI_COLORS = ['#7c4dff', '#ec4899', '#f97316', '#eab308', '#14b8a6', '#0ea5e9', '#ef4444', '#22c55e', '#9be13d'];

function triggerConfetti(count){
  const originEl = document.querySelector('.app');
  if (!originEl) return;
  const rect = originEl.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + 90;

  for (let i = 0; i < count; i++){
    const el = document.createElement('div');
    const size = 6 + Math.random() * 6;
    const color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    const angle = (Math.random() * Math.PI) - (Math.PI / 2) - (Math.PI / 2);
    const distance = 90 + Math.random() * 170;
    const dx = Math.cos(angle) * distance + (Math.random() * 60 - 30);
    const dy = Math.abs(Math.sin(angle) * distance) + 60 + Math.random() * 80;
    const rotate = Math.random() * 720 - 360;
    const duration = 700 + Math.random() * 500;

    el.style.cssText = `
      position:fixed; left:${originX}px; top:${originY}px;
      width:${size}px; height:${size * (Math.random() > 0.5 ? 1 : 1.6)}px;
      background:${color}; z-index:9999; pointer-events:none;
      border-radius:${Math.random() > 0.5 ? '2px' : '50%'};
      opacity:1; transform: translate(-50%,-50%) rotate(0deg);
      transition: transform ${duration}ms cubic-bezier(.15,.7,.3,1), opacity ${duration}ms ease-in;
    `;
    document.body.appendChild(el);

    requestAnimationFrame(() => {
      el.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rotate}deg)`;
      el.style.opacity = '0';
    });

    setTimeout(() => el.remove(), duration + 60);
  }
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
document.addEventListener('click', (e) => {
  if (activeMainTab !== 2) return;
  if (e.target.closest('.hotspot') || e.target.closest('.board-tooltip')) return;
  const tooltip = document.getElementById('boardTooltip');
  if (tooltip) tooltip.classList.remove('show');
  document.querySelectorAll('.hotspot.rumble').forEach(m => m.classList.remove('rumble'));
});

renderTabs();
renderBody();
</script>
